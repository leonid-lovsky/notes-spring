include 'user:persistence:jpa'
include 'user:runtime:spring'
include 'user:messaging:kafka'
include 'user:messaging:outbox'
include 'user:integration:feign'

include 'auth:contract'
include 'auth:service'
include 'auth:presentation:rest'
include 'auth:persistence:jpa'
include 'auth:runtime:spring'
include 'auth:messaging:kafka'
