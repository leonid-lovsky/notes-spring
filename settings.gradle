include 'note:contract'
include 'note:service'
include 'note:presentation:rest'
include 'note:persistence:jpa'
include 'note:runtime:spring'
include 'note:messaging:kafka'
include 'note:messaging:outbox'
include 'note:integration:feign'

include 'user:contract'
