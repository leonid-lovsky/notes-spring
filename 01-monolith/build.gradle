plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def supportedDBMS = [postgresql: 'PostgreSQL', mysql: 'MySQL']

def applicationProperties = new Properties()
file('src/main/resources/application.properties').withInputStream { applicationProperties.load(it) }
def defaultDBMS = applicationProperties.getProperty('spring.profiles.default')

def otherDBMS = supportedDBMS.findAll { profile, DBMSName -> profile != defaultDBMS }

def DBMSTests = otherDBMS.collect { profile, DBMSName ->
    tasks.register("test${DBMSName}", Test) {
        description = "Runs the tests against ${DBMSName}."
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        systemProperty 'spring.profiles.active', profile
        useJUnitPlatform()
    }
}

tasks.named('check') {
    dependsOn DBMSTests
}
