def projects() {
    gradle.includedBuilds.findAll { it.name != 'build-logic' }
}

tasks.register('clean') {
    dependsOn gradle.includedBuilds.collect { it.task(':clean') }
}

tasks.register('test') {
    dependsOn projects().collect { it.task(':test') }
}

tasks.register('build') {
    dependsOn projects().collect { it.task(':build') }
}
